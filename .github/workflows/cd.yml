name: Manual container release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish Rust service images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: frontend, dockerfile: apps/frontend/Dockerfile }
          - { name: admin, dockerfile: apps/admin/Dockerfile }
          - { name: backend, dockerfile: apps/backend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
