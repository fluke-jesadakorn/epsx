name: Rust CI

on:
  push:
    branches: [development, staging, production, migration/dioxus-microservices]
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    name: Cargo, Dioxus, and migration gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Verify frozen assets
        run: cargo xtask assets verify
      - name: Verify migration evidence
        run: |
          cargo xtask e2e doctor
          cargo xtask e2e verify-artifacts
      - name: Enforce the Rust-only workspace
        run: |
          cargo xtask audit no-node --strict
          cargo xtask rust-audit --strict
      - name: Verify migration and authority contracts
        run: |
          cargo xtask migration-audit --strict
          cargo xtask authority-audit --strict
          cargo xtask k8s-audit --strict
      - name: Release build
        run: cargo xtask build --profile production

  shadow-migrations:
    name: Fresh PostgreSQL migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: epsx_shadow
          POSTGRES_PASSWORD: epsx_shadow_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epsx_shadow -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create isolated databases and preservation sentinels
        env:
          PGPASSWORD: epsx_shadow_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U epsx_shadow -d postgres <<'SQL'
          CREATE DATABASE epsx_core_shadow;
          CREATE DATABASE epsx_analytics_shadow;
          CREATE DATABASE epsx_payments_shadow;
          CREATE DATABASE epsx_notifications_shadow;
          SQL
          for database_name in epsx_core_shadow epsx_analytics_shadow epsx_payments_shadow epsx_notifications_shadow; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U epsx_shadow -d "$database_name" -c "CREATE TABLE migration_sentinel (id integer PRIMARY KEY, marker text NOT NULL); INSERT INTO migration_sentinel VALUES (1, 'preserve-me');"
          done
      - name: Apply every embedded migration twice
        env:
          DATABASE_URL: postgresql://epsx_shadow:epsx_shadow_only@127.0.0.1:5432/epsx_core_shadow
          ANALYTICS_DATABASE_URL: postgresql://epsx_shadow:epsx_shadow_only@127.0.0.1:5432/epsx_analytics_shadow
          PAYMENTS_DATABASE_URL: postgresql://epsx_shadow:epsx_shadow_only@127.0.0.1:5432/epsx_payments_shadow
          NOTIFICATIONS_DATABASE_URL: postgresql://epsx_shadow:epsx_shadow_only@127.0.0.1:5432/epsx_notifications_shadow
        run: |
          cargo run -p epsx --features cli-tools --bin migrate -- up
          target/debug/migrate up
      - name: Verify preservation, versions, and split-payment projection
        env:
          PGPASSWORD: epsx_shadow_only
        run: |
          expected_rows=(
            'epsx_core_shadow|preserve-me|22'
            'epsx_analytics_shadow|preserve-me|3'
            'epsx_payments_shadow|preserve-me|7'
            'epsx_notifications_shadow|preserve-me|11'
          )
          for expected in "${expected_rows[@]}"; do
            database_name="${expected%%|*}"
            actual="$(psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U epsx_shadow -d "$database_name" -Atqc "SELECT current_database(), marker, (SELECT COUNT(*) FROM __diesel_schema_migrations) FROM migration_sentinel WHERE id = 1")"
            test "$actual" = "$expected"
          done
          projection="$(psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U epsx_shadow -d epsx_payments_shadow -Atqc "SELECT to_regclass('public.plans') IS NULL, to_regclass('payments.plans') IS NOT NULL, COUNT(*) FROM payments.plans")"
          test "$projection" = 't|t|0'
          cqrs_tables="$(psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U epsx_shadow -d epsx_core_shadow -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('event_store', 'outbox_events', 'aggregate_snapshots')")"
          test "$cqrs_tables" = '3'

  contracts:
    name: Foundry contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --root apps/contracts
      - run: forge test --root apps/contracts
