name: Migration E2E evidence

on:
  push:
    branches:
      - "e2e/[1-9]-*"
  pull_request:
    branches:
      - migration/dioxus-microservices
  workflow_dispatch:
    inputs:
      group:
        description: Campaign group (0-9); defaults to the e2e branch name
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: migration-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cumulative-campaign:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'e2e/')
    name: Cumulative migration group gate
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Derive campaign group
        id: campaign
        env:
          DISPATCH_GROUP: ${{ inputs.group }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          branch="$HEAD_BRANCH"
          if [ -z "$branch" ]; then
            branch="$REF_BRANCH"
          fi
          group="$DISPATCH_GROUP"
          if [ -z "$group" ]; then
            if [[ "$branch" =~ ^e2e/([0-9])- ]]; then
              group="${BASH_REMATCH[1]}"
            else
              echo "Unsupported campaign branch: $branch" >&2
              exit 1
            fi
          fi
          if [[ ! "$group" =~ ^[0-9]$ ]]; then
            echo "Campaign group must be an integer from 0 through 9" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$group" = "0" ]; then
            echo "PR 0 remains pinned to its published branch" >&2
            exit 1
          fi
          echo "group=$group" >> "$GITHUB_OUTPUT"

      - name: Check out exact target
        env:
          E2E_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --no-recurse-submodules origin \
            "$E2E_TARGET_SHA" \
            "+refs/heads/development:refs/remotes/origin/development" \
            "+refs/heads/migration/dioxus-microservices:refs/remotes/origin/migration/dioxus-microservices"
          git checkout --detach "$E2E_TARGET_SHA"
          git rev-parse --verify HEAD | grep -Fx "$E2E_TARGET_SHA"

      - name: Fetch immutable source ref
        run: git fetch origin development:refs/remotes/origin/development

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install target dependencies
        run: bun install --frozen-lockfile

      - name: Install campaign browsers
        env:
          E2E_GROUP: ${{ steps.campaign.outputs.group }}
        run: |
          if [ "$E2E_GROUP" = "9" ]; then
            bunx playwright install --with-deps chromium firefox webkit
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Validate migration manifest
        run: bun e2e/migration/cli.ts doctor --group ${{ steps.campaign.outputs.group }}

      - name: Type-check migration harness
        run: bun run type-check:e2e:migration

      - name: Run cumulative evidence gate
        run: bun e2e/migration/cli.ts run --group ${{ steps.campaign.outputs.group }}

      - name: Verify artifact hashes
        run: bun e2e/migration/cli.ts verify-artifacts --group ${{ steps.campaign.outputs.group }}

      - name: Upload full migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-e2e-pr${{ steps.campaign.outputs.group }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            e2e/migration/artifacts/
            docs/e2e/pr${{ steps.campaign.outputs.group }}/evidence/
          if-no-files-found: error
          retention-days: 14
