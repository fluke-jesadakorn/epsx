name: Promotion Pipeline

on:
  pull_request:
    branches: [development, staging, production]
  push:
    branches: [development, staging, production]

concurrency:
  group: promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-release-gate:
    # Keep this status name aligned with the protected development branch.
    name: Promotion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-unknown-unknown
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler pkg-config libssl-dev
      - name: Install pinned Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: Build release workspace
        run: cargo xtask native package --output target/native-releases/ci-${{ github.sha }}
      - name: Verify contracts from pinned submodules
        run: |
          forge build --root apps/contracts
          forge test --root apps/contracts
      - name: Enforce Rust-only promotion inputs
        run: |
          cargo xtask audit no-node --strict
          # Exact browser-adapter review is enforced by the no-node audit.
          cargo xtask migration-audit --strict
          cargo xtask authority-audit --strict
          # Archived Kubernetes overlays are not native release prerequisites.
