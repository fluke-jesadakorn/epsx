name: Promotion Pipeline

on:
  pull_request:
    branches: [development, staging, production]
  push:
    branches: [development, staging, production]

concurrency:
  group: promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-release-gate:
    name: Rust/Dioxus/Foundry release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: Build release workspace
        run: cargo xtask build --profile production
      - name: Verify contracts from pinned submodules
        run: |
          forge build --root apps/contracts
          forge test --root apps/contracts
      - name: Enforce Rust-only promotion inputs
        run: |
          cargo xtask audit no-node --strict
          cargo xtask rust-audit --strict
          cargo xtask migration-audit --strict
          cargo xtask authority-audit --strict
          cargo xtask k8s-audit --strict
