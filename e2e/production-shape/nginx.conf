worker_processes 1;
pid /tmp/epsx-e2e-nginx.pid;
error_log /tmp/epsx-e2e-edge-error.log info;

events {
    worker_connections 128;
}

http {
    access_log /tmp/epsx-e2e-edge-access.log;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 4443 ssl;
        server_name epsx.e2e.localhost;
        ssl_certificate /tmp/epsx-e2e-edge.crt;
        ssl_certificate_key /tmp/epsx-e2e-edge.key;

        location / {
            proxy_pass http://127.0.0.1:4200;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 4443;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 4443 ssl;
        server_name admin.e2e.localhost;
        ssl_certificate /tmp/epsx-e2e-edge.crt;
        ssl_certificate_key /tmp/epsx-e2e-edge.key;

        location / {
            proxy_pass http://127.0.0.1:4201;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 4443;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
