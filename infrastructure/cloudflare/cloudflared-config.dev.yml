# Native dev origins. Production/staging routes are managed separately.
# Validate before starting:
# cloudflared tunnel --config infrastructure/cloudflare/cloudflared-config.dev.yml ingress validate
# cloudflared tunnel --config infrastructure/cloudflare/cloudflared-config.dev.yml run epsx-dev
# DNS: four proxied CNAMEs to db141d3c-cc9a-4785-bf2e-dcdffabd36c6.cfargotunnel.com.
# Confirm the epsx.io zone/account before changing DNS; tunnel credentials only authorize running it.
tunnel: db141d3c-cc9a-4785-bf2e-dcdffabd36c6
credentials-file: /Users/fluke/.cloudflared/db141d3c-cc9a-4785-bf2e-dcdffabd36c6.json

ingress:
  - hostname: dev.epsx.io
    service: http://127.0.0.1:3000
  - hostname: dev-admin.epsx.io
    service: http://127.0.0.1:3001
  - hostname: dev-api.epsx.io
    service: http://127.0.0.1:8080
  - hostname: dev-pay.epsx.io
    service: http://127.0.0.1:3002
  - service: http_status:404

loglevel: info
protocol: quic
no-autoupdate: true
