# ============================================================================
# wave49(slice-1): staging NodePort patches. The 30082/30083 pair is
# intentionally distinct from prod's 30084/30085 pair because NodePorts
# are cluster-global when both overlays share the local Colima cluster.
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: epsx-pay-svc
spec:
  type: NodePort
  ports:
    - name: http
      port: 8103
      targetPort: 8103
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: epsx-pay-bff
spec:
  type: NodePort
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      nodePort: 30083
