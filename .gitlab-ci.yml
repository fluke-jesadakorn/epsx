stages: [check, test, build]

variables:
  CARGO_HOME: /tmp/cargo
  CARGO_TARGET_DIR: target

default:
  image: rust:bookworm
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - /tmp/cargo/registry/
      - /tmp/cargo/git/
      - target/
  before_script:
    - rustup component add rustfmt clippy
    - rustup target add wasm32-unknown-unknown

format-and-audit:
  stage: check
  script:
    - cargo fmt --all --check
    - cargo xtask assets verify
    - cargo xtask e2e doctor
    - cargo xtask e2e verify-artifacts
    - cargo xtask audit no-node --strict

clippy:
  stage: check
  script:
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

tests:
  stage: test
  script:
    - cargo test --workspace --locked

release:
  stage: build
  script:
    - cargo install wasm-bindgen-cli --version 0.2.123 --locked
    - cargo xtask build --profile production
