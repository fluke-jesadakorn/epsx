apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Core prod topology — frontend (bff-frontend :3000), admin (bff-admin :3001),
# backend (epsx :8080, Axum + Diesel). Each has its own Deployment/Service
# with independent probes and resources (see overlays/prod/patches/*.yaml).
# Backend stays pure Axum (not DX) for k8s horizontal scaling:
#   kubectl apply -k infrastructure/kubernetes/base/backend   # backend only
#   kubectl apply -k infrastructure/kubernetes/overlays/prod  # full stack
#   kubectl scale deployment/epsx-backend --replicas=3        # HPA target
# Frontend/Admin HMR (`dx serve --hot-reload` + tailwind --watch + wasm --watch)
# is dev-only; prod stays `bff-frontend` (Axum SSR + dioxus_ssr) via :8080.

resources:
  - namespace.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/postgres-external.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - admin/deployment.yaml
  - admin/service.yaml

# Keep this base limited to the production-authorized core inventory.
# Dev and staging opt into migration services explicitly in their overlays.
