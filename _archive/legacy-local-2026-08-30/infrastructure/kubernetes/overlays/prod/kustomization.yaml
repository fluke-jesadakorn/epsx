apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: epsx-prod

resources:
  - ../../base

images:
  - name: epsx-backend
    newName: epsx-backend
    newTag: prod
  - name: epsx-frontend
    newName: epsx-frontend
    newTag: prod
  - name: epsx-admin
    newName: epsx-admin
    newTag: prod

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml
  - path: patches/services-nodeport.yaml
