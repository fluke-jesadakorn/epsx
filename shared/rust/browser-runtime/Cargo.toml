[package]
name = "epsx-browser-runtime"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "AbortController",
  "BroadcastChannel",
  "Clipboard",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventSource",
  "Headers",
  "History",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "MediaQueryList",
  "Navigator",
  "Node",
  "NodeList",
  "Request",
  "RequestCache",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "Response",
  "ServiceWorkerContainer",
  "RegistrationOptions",
  "Storage",
  "Url",
  "Window",
] }
