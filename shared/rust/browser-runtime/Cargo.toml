[package]
name = "epsx-browser-runtime"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "AbortController",
  "Blob",
  "BroadcastChannel",
  "Clipboard",
  "CustomEvent",
  "CustomEventInit",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventSource",
  "DragEvent",
  "File",
  "FileList",
  "FormData",
  "Headers",
  "History",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "Request",
  "RequestCache",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "Response",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
  "RegistrationOptions",
  "Storage",
  "Url",
  "Window",
  "console",
] }
